apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: poc-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: poc-secrets
    creationPolicy: Owner
  data:
    - secretKey: mongo-connection-string
      remoteRef:
        key: poc-secrets
        property: mongo-connection-string
    - secretKey: mongo-root-password
      remoteRef:
        key: poc-secrets
        property: mongo-root-password
    - secretKey: etiqueta
      remoteRef:
        key: poc-secrets
        property: etiqueta
    - secretKey: banner
      remoteRef:
        key: poc-secrets
        property: banner
